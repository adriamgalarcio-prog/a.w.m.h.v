<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Contactanos!</title>
    <link rel="icon" type="image/png" href="Img/logo.png">
    <link rel="stylesheet" href="stylecont.css">
</head>
<body>
    <a href="Index.html">
        <img src="Img/flechita.png" class="flechita">
    </a>

    <div class="container-contact">
        <form class="form">
            <h3>Envíanos un mensaje</h3>
            <p>Para AWMHV Sport tu opinión es muy importante, por favor, 
                comparte con nosotros tus comentarios, te contactaremos lo antes posible. </p>
            <label for="name">Escribe tu nombre</label>
            <input type="text" id="name" class="box" required>
            <label for="correo">Escribe tu correo</label>
            <input type="email" id="correo" class="box" required>
            <label for="message">Escribe tu mensaje</label>
            <textarea class="box-1" id="message" cols="30" rows="10" required></textarea>
            <input type="submit" value="Enviar" class="submit">
        </form>
        <div class="info">
            <img src="Img/mensaje.png" class="img-1" alt="">
            <div class="location">
                <div class="icons">
                    <img src="Img/email.png" alt="">
                    <p>a.w.m.h.vsport@gmail.com</p>
                </div>
                <div class="icons">
                    <img src="Img/phone.png" alt="">
                    <p>+57 350 5186236</p>
                </div>
            </div>
            <div class="social">
            <img src="Img/Fa.png" alt="">
            <img src="Img/YT.png" alt="">
            <img src="Img/ig.png" alt="">
            </div>
        </div>
    </div>
</body>
</html>
