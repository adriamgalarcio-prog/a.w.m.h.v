<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion </title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="objeto">
        <img src="/Img/Logo.png" class="Logo">
    </div>
        <div class="contenedor">
            <h1>Bienvenido a <br>A.W.M.H.V</h1>
            <p class="Description">Comprar y crear una cuenta con nosotros</p>
            <form>
                <div class="input-blox">
                    <input type="text" placeholder="Nombre de usuario" required >
                </div>
                <div class="input-blox">
                    <input type="password" placeholder="Contraseña" required >
                </div>
                <div class="recordar-password">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                <button class="btn" >Continuar</button>
                <p class="register-link">¿No tienes una cuenta?<a href="#">Registrate</a></p>
            </form> 
        </div>
        
</body>
</html>
