<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personaliza a tu gusto</title>
    <link rel="icon" type="image/png" href="assets/img/Logo.png">
    <link rel="stylesheet" href="assets/css/Personalizacion.css">
</head>
<body>
        <div class="Personalizacion">
            <a href="Index.html#Galeria">
            <img src="assets/img/flechita2.png" alt="Volver" class="flecha">
            </a>
            <form class="form" id="form-personalizacion">
            <h3>Personalización de tus guantes y otros</h3>
            <p>Sube y elige la imagen que quieras y nosotros te la personalizaremos a tus gustos</p>
            <label for="name">Escribe tu nombre</label>
            <input type="text" id="name" class="box" required>
            <label for="correo">Escribe tu correo</label>
            <input type="email" id="correo" class="box" required>
            <label for="opciones">Selecciona el producto</label>
            <select name="opciones" id="opciones" class="box" required>
                <option value="Hombre">Hombre</option>
                <option value="Accesorio">Accesorio</option>
            </select>
            <label for="url">Sube tu Imagen</label>
            <input type="file" id="url" class="box-2" accept="image/*">
            <p class="ayuda">Cuando se abra WhatsApp, adjunta esta misma imagen en el chat.</p>
            <label for="message">Escribe Características</label>
            <textarea class="box-1" id="message" cols="30" rows="10" required></textarea>
            <input type="submit" value="Enviar por WhatsApp" class="submit">
            </form>
        </div>
    <script src="assets/js/personalizacion.js"></script>
</body>
</html>
