<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWMHV Sport</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <a href="login.html">
        <img src="Img/flechita.png" class="Logo" >
    </a>
    <div class="contenedor">
            <h1>Registrate en <br>A.W.M.H.V</h1>
            <p class="Description">Comprar y crear una cuenta con nosotros</p>
            <form>
                <div class="input-blox">
                    <input type="text" placeholder="Nombres" required >
                </div>
                <div class="input-blox">
                    <input type="text" placeholder="Apellidos (Opcional)" >
                </div>
                <div class="input-blox">
                    <input type="email" placeholder="Correo" required >
                </div>
                <div class="input-blox">
                    <input type="password" placeholder="Contraseña" required >
                </div>
                <div class="input-blox">
                    <input type="password" placeholder="Confirmar Contraseña" required >
                </div>
                <button class="btn" >Continuar</button>
                <p class="register-link">¿Ya tienes una cuenta?<a href="login.html">Iniciar sesion</a></p>
            </form> 
        </div>
</body>
</html>
